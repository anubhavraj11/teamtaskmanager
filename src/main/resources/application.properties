spring.application.name=team-task-manager

# Server (Railway compatible)
server.port=${PORT:8081}

# =========================
# DATABASE CONFIG (PostgreSQL)
# =========================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/taskdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Admin@1234}
spring.datasource.driver-class-name=org.postgresql.Driver

# =========================
# JPA / HIBERNATE
# =========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# =========================
# JACKSON
# =========================
spring.jackson.default-property-inclusion=non_null

# =========================
# JWT CONFIG
# =========================
application.security.jwt.secret=${JWT_SECRET:MySuperSecureJWTSecretKey1234567890@Anubhav}
application.security.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# =========================
# ADMIN BOOTSTRAP (IMPORTANT)
# =========================
application.bootstrap.admin.full-name=${ADMIN_FULL_NAME:}
application.bootstrap.admin.email=${ADMIN_EMAIL:}
application.bootstrap.admin.password=${ADMIN_PASSWORD:}
